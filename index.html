<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>

        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1173d4",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Work Sans"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex flex-col min-h-screen">
<header class="flex items-center justify-between px-6 sm:px-10 py-4 border-b border-background-light dark:border-background-dark/20">
<div class="flex items-center gap-3">
<div class="w-8 h-8 text-primary">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M36.7273 44C33.9891 44 31.6043 39.8386 30.3636 33.69C29.123 39.8386 26.7382 44 24 44C21.2618 44 18.877 39.8386 17.6364 33.69C16.3957 39.8386 14.0109 44 11.2727 44C7.25611 44 4 35.0457 4 24C4 12.9543 7.25611 4 11.2727 4C14.0109 4 16.3957 8.16144 17.6364 14.31C18.877 8.16144 21.2618 4 24 4C26.7382 4 29.123 8.16144 30.3636 14.31C31.6043 8.16144 33.9891 4 36.7273 4C40.7439 4 44 12.9543 44 24C44 35.0457 40.7439 44 36.7273 44Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-lg font-bold text-gray-800 dark:text-gray-200">Logistics Hub</h2>
</div>
<div class="flex items-center gap-4">
<div class="w-10 h-10 bg-cover bg-center rounded-full" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB_BV_vQLCeyZt-bXav4-fA7dHvm54JfFhl96y73rc9az_Ols0bULsng_fmn4tUgNkx2A7RvsJEXiI5DgO-8eqW3t1wmP2ENfNoni0I4BBXCxvSzQoss5JZsGg0se0MDN1sBuucasQYJgTg0_ZkN9X6IUoEYmCc2ygsnnFoMm5WlPa-euMH3nLsHHhru6PeLXHtYw68T_X9_T-eQvSbD2d_X9kltc0oNgAqCJoIHx0OSkzfuUMGgrARQxsvcRCW6O2A0GukNzYP7E2W");'></div>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8">
<div class="w-full max-w-2xl text-center">
<h1 class="text-4xl sm:text-5xl font-bold text-gray-900 dark:text-white mb-4">Logistics Hub</h1>
<p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
                    Search across Truckload and Batz CRM channels
                </p>
<form class="relative" id="searchForm">
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<svg class="h-6 w-6 text-gray-400 dark:text-gray-500" fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path>
</svg>
</div>
<input class="w-full py-4 pl-14 pr-4 text-base bg-background-light dark:bg-background-dark/20 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-primary focus:border-primary text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400" placeholder="Search across Truckload and Batz CRM" type="search" id="searchInput" name="q"/>
</div>
</form>
</div>
</main>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    
    searchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const searchQuery = searchInput.value.trim();
        if (searchQuery) {
            // Redirect to search results page with query parameter
            window.location.href = `search-results.html?q=${encodeURIComponent(searchQuery)}`;
        }
    });
    
    // Also handle Enter key press in the input field
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchForm.dispatchEvent(new Event('submit'));
        }
    });
});
</script>

</body></html>
